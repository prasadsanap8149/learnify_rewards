name: learnify_rewards
description: "Learn & Earn - Gamified learning platform with rewards for completing educational activities and quizzes."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Core dependencies for mobile app stores
  cupertino_icons: ^1.0.8

  # Firebase dependencies for backend services (FREE TIER OPTIMIZED)
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  firebase_analytics: ^12.0.0
  firebase_crashlytics: ^5.0.0
  firebase_performance: ^0.11.0
  firebase_remote_config: ^6.0.0
  firebase_messaging: ^16.0.0
  # cloud_functions: ^5.1.3  # REMOVED - No server costs!

  # Enhanced Security and Encryption (CLIENT-SIDE ONLY)
  encrypt: ^5.0.3
  crypto: ^3.0.6

  # Environment Configuration (SERVERLESS)
  flutter_dotenv: ^5.1.0

  # UI and Navigation
  go_router: ^16.2.0
  provider: ^6.1.2

  # Google Services
  google_sign_in: ^6.1.1
  google_mobile_ads: ^6.0.0

  # Additional mobile-focused packages
  shared_preferences: ^2.3.2
  package_info_plus: ^8.3.1
  device_info_plus: ^11.5.0
  connectivity_plus: ^6.0.5
  permission_handler: ^12.0.1
  local_auth: ^2.3.0
  biometric_storage: ^5.0.0

  # UI Components
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting and code quality
  flutter_lints: ^6.0.0

  # Testing utilities
  mockito: ^5.4.4
  build_runner: ^2.4.13
  fake_cloud_firestore: ^4.0.0 # Updated for compatibility with cloud_firestore 6.0.0

  # Build tools
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  # App assets for mobile stores
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/sounds/

  # Custom fonts for better mobile experience (uncomment when fonts are available)
